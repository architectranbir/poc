name: Publish Azure runtime images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-poc-apply
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      ACR_SERVER: ${{ vars.AZURE_ACR_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate registry
        run: |
          test -n "$ACR_NAME" && test -n "$ACR_SERVER"
          az acr login --name "$ACR_NAME"
      - name: Publish .NET services
        run: |
          for project in Api SapWorker SapSimulator OutboxDispatcher; do
            image="$ACR_SERVER/ledgerpilot-${project,,}:$GITHUB_SHA"
            docker build -f containers/Dockerfile.dotnet --build-arg "PROJECT=LedgerPilot.$project" -t "$image" .
            docker push "$image"
          done
          docker build -f containers/Dockerfile.workflows -t "$ACR_SERVER/ledgerpilot-workflows:$GITHUB_SHA" .
          docker push "$ACR_SERVER/ledgerpilot-workflows:$GITHUB_SHA"
      - name: Publish authenticated React image
        env:
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_WEB_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
          VITE_API_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          for name in VITE_ENTRA_CLIENT_ID VITE_ENTRA_TENANT_ID VITE_ENTRA_API_SCOPE VITE_API_URL; do
            test -n "${!name}" || exit 1
          done
          docker build -f containers/Dockerfile.web --target production --build-arg VITE_ENTRA_CLIENT_ID --build-arg VITE_ENTRA_TENANT_ID --build-arg VITE_ENTRA_API_SCOPE --build-arg VITE_API_URL -t "$ACR_SERVER/ledgerpilot-web:$GITHUB_SHA" .
          docker push "$ACR_SERVER/ledgerpilot-web:$GITHUB_SHA"
