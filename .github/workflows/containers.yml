name: Container end-to-end checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  container-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build runtime images
        run: docker compose --profile azure --profile hosted build
      - name: Build hosted React image
        run: docker build -f containers/Dockerfile.web --target production -t ledgerpilot-web .
      - name: Start isolated synthetic services
        run: |
          python3 scripts/prepare-container-keys.py
          docker compose up -d postgres azurite api sap workflows web
      - name: Test packaged posting flow
        run: python3 scripts/smoke-containers.py
      - name: Install browser test runtime
        run: |
          npm ci --prefix tests/browser
          npx --prefix tests/browser playwright install --with-deps chromium
      - name: Test React billing journey
        run: node tests/browser/posting.mjs
      - name: Test hosted demo without Entra registration
        env:
          API_URL: http://localhost:8088
          WEB_URL: http://localhost:8088
        run: |
          docker compose stop api
          docker compose --profile hosted up -d hosted
          python3 scripts/smoke-hosted.py
          node tests/browser/posting.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-browser-evidence
          path: artifacts/browser
      - name: Show service failures
        if: failure()
        run: |
          docker compose logs workflows
          docker compose logs --tail=100 api sap worker azurite
      - name: Clean up
        if: always()
        run: docker compose --profile hosted down --volumes
