name: LedgerPilot foundation checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore LedgerPilot.slnx --locked-mode -m:1
      - run: dotnet build LedgerPilot.slnx -c Release --no-restore -m:1
      - run: dotnet test tests/LedgerPilot.Domain.Tests -c Release --no-build --logger "trx;LogFileName=domain.trx" --results-directory artifacts/tests
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/smoke-local.py
      - run: python3 scripts/smoke-simulator.py
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-test-results
          path: artifacts/tests

