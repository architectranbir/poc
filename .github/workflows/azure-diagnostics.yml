name: Azure runtime diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/azure-diagnostics.yml']
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-poc-plan
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || '8ed05bb8-398a-40c5-ad12-0a0bc39995e8' }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || 'fcf67057-50c9-4ad4-98f3-ffca64add9e9' }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || '5c3f194f-27c4-47eb-bb4e-30400040fa00' }}
      - name: Provider registration and provisioned resources
        run: |
          for provider in Microsoft.App Microsoft.DBforPostgreSQL; do
            az provider show --namespace "$provider" --query '{namespace:namespace,state:registrationState}' -o json
          done
          az resource list --resource-group rg-ledgerpilot-7dde6178 --query '[].{name:name,type:type,location:location}' -o table
      - name: Database availability in preferred and fallback regions
        run: |
          for region in southindia centralindia uksouth westeurope eastus; do
            echo "PostgreSQL capabilities: $region"
            az postgres flexible-server list-skus --location "$region" -o json > "$region.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps([{"reason":c.get("reason"),"versions":c.get("supportedServerVersions"),"b1ms":[s for e in c.get("supportedServerEditions",[]) for s in e.get("supportedServerSkus",[]) if s.get("name")=="Standard_B1ms"]} for c in d]))' "$region.json"
          done
