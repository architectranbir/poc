name: LedgerPilot foundation checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledgerpilot
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: ledgerpilot_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledgerpilot -d ledgerpilot_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore LedgerPilot.slnx --locked-mode -m:1
      - run: dotnet restore src/LedgerPilot.Workflows/LedgerPilot.Workflows.csproj --locked-mode -m:1
      - run: dotnet build LedgerPilot.slnx -c Release --no-restore -m:1
      - run: dotnet test tests/LedgerPilot.Domain.Tests -c Release --no-build --logger "trx;LogFileName=domain.trx" --results-directory artifacts/tests
      - run: dotnet test tests/LedgerPilot.Persistence.Tests -c Release --no-build --logger "trx;LogFileName=persistence.trx" --results-directory artifacts/tests
        env:
          POSTGRES_TEST_CONNECTION: Host=localhost;Username=ledgerpilot;Password=local-test-only;Database=ledgerpilot_tests
      - run: dotnet test tests/LedgerPilot.Workflows.Tests -c Release --no-build --logger "trx;LogFileName=workflows.trx" --results-directory artifacts/tests
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/smoke-local.py
      - run: python3 scripts/smoke-simulator.py
      - run: python3 scripts/smoke-simulator.py
        name: PostgreSQL worker recovery smoke
        env:
          COMMAND_STORE_CONNECTION: Host=localhost;Username=ledgerpilot;Password=local-test-only;Database=ledgerpilot_tests
      - run: npm install --global azure-functions-core-tools@4 azurite
      - run: python3 scripts/smoke-postgres-api.py
        name: PostgreSQL API to SAP worker and Durable host smoke
        env:
          COMMAND_STORE_CONNECTION: Host=localhost;Username=ledgerpilot;Password=local-test-only;Database=ledgerpilot_tests
          WORKFLOW_SMOKE: true
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-test-results
          path: artifacts/tests

