name: Publish Azure runtime images
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-poc-apply
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME || 'acrlp7dde6178' }}
      ACR_SERVER: ${{ vars.AZURE_ACR_SERVER || 'acrlp7dde6178.azurecr.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || '8ed05bb8-398a-40c5-ad12-0a0bc39995e8' }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || 'fcf67057-50c9-4ad4-98f3-ffca64add9e9' }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || '5c3f194f-27c4-47eb-bb4e-30400040fa00' }}
      - name: Authenticate registry
        run: |
          test -n "$ACR_NAME" && test -n "$ACR_SERVER"
          az acr login --name "$ACR_NAME"
      - name: Publish .NET services
        run: |
          for project in Api SapWorker SapSimulator OutboxDispatcher; do
            image="$ACR_SERVER/ledgerpilot-${project,,}:$GITHUB_SHA"
            docker build -f containers/Dockerfile.dotnet --build-arg "PROJECT=LedgerPilot.$project" -t "$image" .
            docker push "$image"
          done
          docker build -f containers/Dockerfile.workflows -t "$ACR_SERVER/ledgerpilot-workflows:$GITHUB_SHA" .
          docker push "$ACR_SERVER/ledgerpilot-workflows:$GITHUB_SHA"
      - name: Publish demo application without Entra sign-in
        run: |
          docker build -f containers/Dockerfile.demo -t "$ACR_SERVER/ledgerpilot-demo:$GITHUB_SHA" .
          docker push "$ACR_SERVER/ledgerpilot-demo:$GITHUB_SHA"
