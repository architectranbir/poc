name: Release verified conversation frontend
on:
  push:
    branches: [main]
    paths: ['.github/workflows/frontend-release.yml', 'scripts/release-demo.py']
  workflow_run:
    workflows: ['Container end-to-end checks']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ledgerpilot-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-poc-apply
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || '5c3f194f-27c4-47eb-bb4e-30400040fa00' }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ACR_NAME: ${{ vars.AZURE_ACR_NAME || 'acrlp7dde6178' }}
      ACR_SERVER: ${{ vars.AZURE_ACR_SERVER || 'acrlp7dde6178.azurecr.io' }}
      RESOURCE_GROUP: rg-ledgerpilot-${{ vars.AZURE_NAME_SUFFIX || '7dde6178' }}
      APP_NAME: ledgerpilot-${{ vars.AZURE_NAME_SUFFIX || '7dde6178' }}-demo
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Release only the current verified main commit
        id: current
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$RELEASE_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this superseded release.'
          fi
      - name: Validate application source for a workflow-maintenance release
        if: github.event_name == 'push' && steps.current.outputs.deploy == 'true'
        run: |
          verified=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/containers.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
          test -n "$verified" && test "$verified" != 'null'
          git diff --name-only "$verified" "$RELEASE_SHA" > changed-paths.txt
          python3 -c 'from pathlib import Path; allowed={".github/workflows/frontend-release.yml","scripts/release-demo.py"}; changed=set(Path("changed-paths.txt").read_text().splitlines()); assert changed <= allowed, "Application changes require successful container checks for this commit"'
      - uses: azure/login@v2
        if: steps.current.outputs.deploy == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || '8ed05bb8-398a-40c5-ad12-0a0bc39995e8' }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || 'fcf67057-50c9-4ad4-98f3-ffca64add9e9' }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || '5c3f194f-27c4-47eb-bb4e-30400040fa00' }}
      - name: Publish the verified combined React and API image
        if: steps.current.outputs.deploy == 'true'
        run: |
          az acr login --name "$ACR_NAME"
          image="$ACR_SERVER/ledgerpilot-demo:$RELEASE_SHA"
          docker build -f containers/Dockerfile.demo -t "$image" .
          docker push "$image"
      - name: Update the existing demo through Azure Resource Manager and verify the release
        if: steps.current.outputs.deploy == 'true'
        env:
          RELEASE_IMAGE: ${{ vars.AZURE_ACR_SERVER || 'acrlp7dde6178.azurecr.io' }}/ledgerpilot-demo:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" != "$RELEASE_SHA" ]; then
            echo 'A newer main commit exists; leaving the demo unchanged.'
            exit 0
          fi
          python3 scripts/release-demo.py
