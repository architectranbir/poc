services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledgerpilot
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: ledgerpilot
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ledgerpilot -d ledgerpilot']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: [postgres-data:/var/lib/postgresql/data]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --silent
    volumes: [durable-data:/data]
  api:
    build:
      context: .
      dockerfile: containers/Dockerfile.dotnet
      args: {PROJECT: LedgerPilot.Api}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AUTH_MODE: LocalDemo
      LOCAL_CONTAINER_MODE: 'true'
      COMMAND_STORE_CONNECTION: Host=postgres;Username=ledgerpilot;Password=local-demo-only;Database=ledgerpilot
      WEB_ORIGIN: http://localhost:5173
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      postgres: {condition: service_healthy}
  sap:
    build:
      context: .
      dockerfile: containers/Dockerfile.dotnet
      args: {PROJECT: LedgerPilot.SapSimulator}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SAP_STATE_PATH: /tmp/sap.json
    volumes: [sap-data:/tmp]
  worker:
    build:
      context: .
      dockerfile: containers/Dockerfile.dotnet
      args: {PROJECT: LedgerPilot.SapWorker}
    network_mode: service:sap
    environment:
      DOTNET_ENVIRONMENT: Development
      SAP_TRANSPORT: Postgres
      SAP_SIMULATOR_URL: http://127.0.0.1:8080
      SAP_COMMAND_PATH: /tmp/commands
      COMMAND_STORE_CONNECTION: Host=postgres;Username=ledgerpilot;Password=local-demo-only;Database=ledgerpilot
    restart: on-failure
    depends_on: [api, sap]
  workflows:
    build:
      context: .
      dockerfile: containers/Dockerfile.workflows
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AZURE_FUNCTIONS_ENVIRONMENT: Development
      AzureWebJobsSecretStorageType: files
      AzureWebJobsStorage: UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite
      COMMAND_STORE_CONNECTION: Host=postgres;Username=ledgerpilot;Password=local-demo-only;Database=ledgerpilot
    volumes: ['./.container-secrets:/azure-functions-host/Secrets']
    ports: ['127.0.0.1:7071:80']
    restart: on-failure
    depends_on: [api, azurite]
  web:
    build:
      context: .
      dockerfile: containers/Dockerfile.web
      target: development
    environment:
      VITE_AUTH_MODE: LocalDemo
      VITE_API_URL: http://localhost:8080
    ports: ['127.0.0.1:5173:5173']
    depends_on: [api]
  dispatcher:
    profiles: [azure]
    build:
      context: .
      dockerfile: containers/Dockerfile.dotnet
      args: {PROJECT: LedgerPilot.OutboxDispatcher}
    environment:
      DOTNET_ENVIRONMENT: Development
      COMMAND_STORE_CONNECTION: Host=postgres;Username=ledgerpilot;Password=local-demo-only;Database=ledgerpilot
      SERVICEBUS_NAMESPACE: ${SERVICEBUS_NAMESPACE:-}
    depends_on: [api]
volumes:
  postgres-data:
  sap-data:
  durable-data:
