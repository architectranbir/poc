name: Azure runtime diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/azure-diagnostics.yml']
permissions:
  contents: read
  id-token: write
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-poc-plan
    steps:
      - name: Cancel superseded planning run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh run view 38060282766 --repo "$GITHUB_REPOSITORY" --json status --jq .status)
          if [ "$state" = "in_progress" ] || [ "$state" = "queued" ]; then
            gh run cancel 38060282766 --repo "$GITHUB_REPOSITORY"
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || '8ed05bb8-398a-40c5-ad12-0a0bc39995e8' }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || 'fcf67057-50c9-4ad4-98f3-ffca64add9e9' }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || '5c3f194f-27c4-47eb-bb4e-30400040fa00' }}
      - name: Provider registration and provisioned resources
        run: |
          for provider in Microsoft.App Microsoft.DBforPostgreSQL; do
            az provider show --namespace "$provider" --query '{namespace:namespace,state:registrationState}' -o json
          done
          az resource list --resource-group rg-ledgerpilot-7dde6178 --query '[].{name:name,type:type,location:location}' -o table
          az network vnet show --resource-group rg-ledgerpilot-7dde6178 --name vnet-ledgerpilot-7dde6178 --query '{location:location,subnets:subnets[].name}' -o json
          az postgres flexible-server show --resource-group rg-ledgerpilot-7dde6178 --name pg-ledgerpilot-7dde6178 --query '{location:location,state:state}' -o json || true
          az resource show --resource-group rg-ledgerpilot-7dde6178 --name cae-ledgerpilot-7dde6178 --resource-type Microsoft.App/managedEnvironments --api-version 2024-03-01 --query '{location:location,state:properties.provisioningState}' -o json || true
      - name: Database availability in preferred and fallback regions
        run: |
          for region in southindia centralindia uksouth westeurope eastus; do
            echo "PostgreSQL capabilities: $region"
            az postgres flexible-server list-skus --location "$region" -o json > "$region.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps([{"reason":c.get("reason"),"versions":c.get("supportedServerVersions"),"b1ms":[s for e in c.get("supportedServerEditions",[]) for s in e.get("supportedServerSkus",[]) if s.get("name")=="Standard_B1ms"]} for c in d]))' "$region.json"
          done
      - name: Inspect Terraform lock metadata without reading state contents
        run: |
          az storage blob show --account-name stlptf7dde6178 --container-name tfstate --name ledgerpilot/poc.tfstate --auth-mode login --query metadata -o json | python3 -c 'import sys,json,base64; data=json.load(sys.stdin); value=next((v for k,v in data.items() if k.lower()=="terraformlockid"),""); print(base64.b64decode(value).decode() if value else "No state lock")'
      - name: Recent failed provisioning operations
        run: |
          az monitor activity-log list --resource-group rg-ledgerpilot-7dde6178 --offset 30m --status Failed --query '[].{time:eventTimestamp,resource:resourceId,operation:operationName.value,error:properties.statusMessage}' -o json
      - name: Durable host execution evidence
        run: |
          workspace=$(az monitor log-analytics workspace show --resource-group rg-ledgerpilot-7dde6178 --workspace-name log-ledgerpilot-7dde6178 --query customerId -o tsv)
          az monitor log-analytics query --workspace "$workspace" --analytics-query 'ContainerAppConsoleLogs_CL | where TimeGenerated > ago(30m) | where ContainerAppName_s == "ledgerpilot-7dde6178-workflows" | project TimeGenerated, Log_s | order by TimeGenerated desc | take 60' -o json
